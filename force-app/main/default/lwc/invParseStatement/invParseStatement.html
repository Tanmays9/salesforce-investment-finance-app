<template>
  <lightning-card title="Parse CAS statement">
    <div class="slds-p-around_medium">
      <p>
        Your PDF is stored in Salesforce Files. Parsing prepares a review; it
        does not post transactions.
      </p>
      <lightning-input
        type="password"
        label="PDF password, if required"
        autocomplete="off"
        onchange={handlePassword}
      ></lightning-input>
      <lightning-button
        class="slds-m-top_small"
        variant="brand"
        label="Start background parsing"
        onclick={submit}
        disabled={busy}
      ></lightning-button>
      <p class="slds-m-top_small" role="status">{message}</p>
    </div>
  </lightning-card>
</template>
